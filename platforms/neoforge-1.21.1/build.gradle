    mappings loom.layered {
        mappings("org.quiltmc:quilt-mappings:${project.minecraft_version}+build.9:intermediary-v2")
        officialMojangMappings()
    }
    neoForge "net.neoforged:neoforge:${project.neo_version}"

    // The port only needs the loader/base compatibility layer. Depending on
    // the base module avoids pulling dozens of unrelated client/gameplay
    // mixins into a dedicated server; the full FFAPI jar still satisfies this
    // module dependency when users already have it installed.
    implementation "org.sinytra.forgified-fabric-api:fabric-api-base:${project.ffapi_base_version}"
    implementation "org.sinytra:forgified-fabric-loader:${project.ffloader_version}:full"

    rtreeEmbedded("com.jamieswhiteshirt:rtree-3i-lite-fabric:${project.rtree_version}") {
        transitive = false
    }
    sguiIntermediary("eu.pb4:sgui:${project.sgui_version}") {
        transitive = false
    }
    placeholderIntermediary("eu.pb4:placeholder-api:${project.placeholder_version}") {
        transitive = false
    }
    commonProtectionIntermediary("eu.pb4:common-protection-api:${project.common_protection_api_version}") {
        transitive = false
    }

    compileOnly "us.dynmap:DynmapCoreAPI:${project.dynmap_version}"
    compileOnly "de.bluecolored:bluemap-api:${project.bluemap_version}"
}

def remapMinecraftIntermediary = tasks.register('remapMinecraftIntermediary', RemapJarTask) {
    dependsOn tasks.named('downloadAssets')
    inputFile.set(layout.file(provider {
        // 【核心修复】获取真正的仓库根目录（当前子模块的上一级）
        def rootRepoDir = rootProject.projectDir.parentFile 
        def cacheDir = file("${rootRepoDir}/.gradle/loom-cache")
        
        // 递归搜索整个 loom-cache 目录，不再限制死在 minecraftMaven 子目录
        def matches = fileTree(cacheDir).files.findAll {
            it.name.contains('minecraft') && 
            it.name.contains('merged') && 
            it.name.endsWith('.jar') && 
            !it.name.endsWith('-sources.jar')
        }
        
        if (matches.size() != 1) {
            throw new GradleException("Expected one named Minecraft jar, found ${matches.size()}. Matches: ${matches*.name}")
        }
        matches.first()
    }))
    archiveFileName.set("minecraft-${project.minecraft_version}-intermediary.jar")
    destinationDirectory.set(layout.buildDirectory.dir('intermediaryClasspath'))
    sourceNamespace.set('named')
    targetNamespace.set('intermediary')
    classpath.setFrom(files())
    addNestedDependencies.set(false)
}

def registerIntermediaryRemap = { String taskName, Configuration inputConfiguration, String outputName ->
    tasks.register(taskName, RemapJarTask) {
        dependsOn remapMinecraftIntermediary
        inputFile.set(layout.file(provider { inputConfiguration.singleFile }))
        archiveFileName.set(outputName)
        destinationDirectory.set(layout.buildDirectory.dir('remappedLibraries'))
        sourceNamespace.set('intermediary')
        targetNamespace.set('named')
        // Tiny Remapper needs its classpath in the source namespace to resolve
        // inherited/interface members. Without this, only class names are
        // remapped and intermediary method names leak into the output.
        classpath.setFrom(remapMinecraftIntermediary.flatMap { it.archiveFile })
        addNestedDependencies.set(false)
    }
}

def remapSgui = registerIntermediaryRemap(
        'remapSguiIntermediary',
