def prepareLegacyResources = tasks.register('prepareLegacyResources', Sync) {
    from '../../src/main/resources'
    into layout.buildDirectory.dir('generated/resources/legacy')

    doLast {
        // 26.1 accepts compact ingredient strings, while 1.21.1 still
        // requires the object form. Generate that compatibility form from
        // the shared recipes so both targets keep the same recipe content.
        fileTree(new File(destinationDir, 'data/goml/recipe')).matching {
            include '*.json'
        }.files.each { recipeFile ->
            def recipe = new JsonSlurper().parse(recipeFile)
            if (recipe.key instanceof Map) {
                recipe.key.replaceAll { symbol, ingredient ->
                    if (!(ingredient instanceof String)) {
                        return ingredient
                    }
                    ingredient.startsWith('#')
                            ? [tag: ingredient.substring(1)]
                            : [item: ingredient]
                }
            }
            recipeFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(recipe)) + System.lineSeparator()
        }
    }
}

sourceSets.main.resources.srcDir prepareLegacyResources

