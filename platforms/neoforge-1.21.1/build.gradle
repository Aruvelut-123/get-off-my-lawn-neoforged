def skinFaceRegions = [
        down : [16, 0, 48, 0],
        up   : [8, 0, 40, 0],
        north: [8, 8, 40, 8],
        south: [24, 8, 56, 8],
        west : [16, 8, 48, 8],
        east : [0, 8, 32, 8]
]

def writeSkinFace = { File sourceFile, File outputFile, List<Integer> region ->
    def skin = ImageIO.read(sourceFile)
    if (skin == null || skin.width < 64 || skin.height < 16) {
        throw new GradleException("Expected a 64-pixel-wide Minecraft skin: ${sourceFile}")
    }

    def face = new BufferedImage(8, 8, BufferedImage.TYPE_INT_ARGB)
    def graphics = face.createGraphics()
    try {
        graphics.drawImage(
                skin,
                0, 0, 8, 8,
                region[0], region[1], region[0] + 8, region[1] + 8,
                null
        )
        if (skin.height >= 16 && region[2] + 8 <= skin.width && region[3] + 8 <= skin.height) {
            graphics.drawImage(
                    skin,
                    0, 0, 8, 8,
                    region[2], region[3], region[2] + 8, region[3] + 8,
                    null
            )
        }
    } finally {
        graphics.dispose()
    }

    outputFile.parentFile.mkdirs()
    ImageIO.write(face, 'png', outputFile)
}

def nativeClientResources = tasks.register('generateNativeClientResources') {
    def outputDirectory = layout.buildDirectory.dir('generated/resources/nativeClient')
    outputs.dir outputDirectory
    inputs.files nativeBlockTextures.values().collect { file("../../assets/${it}.png") }
    inputs.property 'nativeBlockTextures', nativeBlockTextures
    inputs.property 'nativeItemModels', nativeItemModels

    doLast {
        def outputRoot = outputDirectory.get().asFile

        nativeBlockTextures.each { blockName, sourceName ->
            def blockStateFile = new File(outputRoot, "assets/${project.mod_id}/blockstates/${blockName}.json")
            def blockModelFile = new File(outputRoot, "assets/${project.mod_id}/models/block/${blockName}.json")
            def itemModelFile = new File(outputRoot, "assets/${project.mod_id}/models/item/${blockName}.json")
            [blockStateFile, blockModelFile, itemModelFile].each { it.parentFile.mkdirs() }
            blockStateFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(
                    [variants: ['': [model: "${project.mod_id}:block/${blockName}"]]]
            ))
            blockModelFile.text = JsonOutput.prettyPrint(JsonOutput.toJson([
                    parent  : 'minecraft:block/cube',
                    textures: [
                            particle: "${project.mod_id}:block/${blockName}_north",
                            down    : "${project.mod_id}:block/${blockName}_down",
                            up      : "${project.mod_id}:block/${blockName}_up",
                            north   : "${project.mod_id}:block/${blockName}_north",
                            south   : "${project.mod_id}:block/${blockName}_south",
                            west    : "${project.mod_id}:block/${blockName}_west",
                            east    : "${project.mod_id}:block/${blockName}_east"
                    ]
            ]))
            itemModelFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(
                    [parent: "${project.mod_id}:block/${blockName}"]
            ))

            def sourceTexture = file("../../assets/${sourceName}.png")
            skinFaceRegions.each { faceName, region ->
                writeSkinFace(
                        sourceTexture,
                        new File(outputRoot, "assets/${project.mod_id}/textures/block/${blockName}_${faceName}.png"),
                        region
                )
            }
        }

        def greeterBlockState = new File(outputRoot, "assets/${project.mod_id}/blockstates/greeter.json")
        def greeterBlockModel = new File(outputRoot, "assets/${project.mod_id}/models/block/greeter.json")
        def greeterItemModel = new File(outputRoot, "assets/${project.mod_id}/models/item/greeter.json")
        [greeterBlockState, greeterBlockModel, greeterItemModel].each { it.parentFile.mkdirs() }
        greeterBlockState.text = JsonOutput.prettyPrint(JsonOutput.toJson(
                [variants: ['': [model: "${project.mod_id}:block/greeter"]]]
        ))
        greeterBlockModel.text = JsonOutput.prettyPrint(JsonOutput.toJson(
                [parent: 'minecraft:block/cube_all', textures: [all: 'minecraft:block/emerald_block']]
        ))
        greeterItemModel.text = JsonOutput.prettyPrint(JsonOutput.toJson(
                [parent: "${project.mod_id}:block/greeter"]
        ))

        nativeItemModels.each { itemName, vanillaModel ->
            def itemModelFile = new File(outputRoot, "assets/${project.mod_id}/models/item/${itemName}.json")
            itemModelFile.parentFile.mkdirs()
            itemModelFile.text = JsonOutput.prettyPrint(JsonOutput.toJson([parent: vanillaModel]))
        }
    }
}

