# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            minecraft: '1.21.1'
            java: 21
            project_cache: platforms/neoforge-1.21.1/.gradle
          - os: ubuntu-latest
            minecraft: '26.1'
            java: 25
            project_cache: .gradle
          - os: ubuntu-latest
            minecraft: '26.1.1'
            java: 25
            project_cache: .gradle
          - os: ubuntu-latest
            minecraft: '26.1.2'
            java: 25
            project_cache: .gradle
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
      - name: setup Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-cleanup: on-success
      - name: restore Minecraft workspace cache
        uses: actions/cache@v4
        with:
          path: ${{ matrix.project_cache }}
          key: goml-${{ runner.os }}-java${{ matrix.java }}-mc${{ matrix.minecraft }}-workspace-gradle-${{ hashFiles('**/*.gradle*', '**/gradle.properties', 'versions/*.properties') }}
          restore-keys: |
            goml-${{ runner.os }}-java${{ matrix.java }}-mc${{ matrix.minecraft }}-workspace-gradle-
      - name: make gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew
      - name: build
        shell: pwsh
        run: ./scripts/build-version.ps1 -Profile '${{ matrix.minecraft }}'
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GOML-${{ matrix.minecraft }}-NeoForge
          path: build/multiversion/${{ matrix.minecraft }}/*.jar
