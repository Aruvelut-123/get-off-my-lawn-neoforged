name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - minecraft: '1.21.1'
            java: 21
          - minecraft: '26.1'
            java: 25
          - minecraft: '26.1.1'
            java: 25
          - minecraft: '26.1.2'
            java: 25

    steps:
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/loom-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release artifact
        shell: pwsh
        run: ./scripts/build-version.ps1 -Profile '${{ matrix.minecraft }}'
      - name: Upload GitHub release
        uses: AButler/upload-release-assets@v3.0
        with:
          files: 'build/multiversion/${{ matrix.minecraft }}/*.jar'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
