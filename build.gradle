import groovy.json.JsonOutput

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.142'
    id 'idea'
    id 'com.modrinth.minotaur' version '2.+'
    id 'com.matthewprenger.cursegradle' version '1.4.0'
}

group = project.maven_group
version = "${project.mod_version}+${project.minecraft_version}+neoforge"

base {
    archivesName = project.archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    mavenCentral()
    maven { url = 'https://maven.nucleoid.xyz/' }
    maven { url = 'https://maven.jamieswhiteshirt.com/libs-release/' }
    maven { url = 'https://repo.bluecolored.de/releases' }
    maven { url = 'https://repo.mikeprimm.com/' }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll(
                    '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
            )
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    jarJar(implementation(group: 'com.jamieswhiteshirt', name: 'rtree-3i-lite-fabric')) {
        version {
            strictly "[${project.rtree_version},${project.rtree_version}]"
            prefer project.rtree_version
        }
    }

    // These PB4 libraries are loader-neutral implementations built entirely on
    // vanilla server primitives. Bundle them so modpacks do not need Fabric jars.
    jarJar(implementation(group: 'eu.pb4', name: 'sgui')) {
        version {
            strictly "[${project.sgui_version},${project.sgui_version}]"
            prefer project.sgui_version
        }
    }
    jarJar(implementation(group: 'eu.pb4', name: 'placeholder-api')) {
        version {
            strictly "[${project.placeholder_version},${project.placeholder_version}]"
            prefer project.placeholder_version
        }
    }
    jarJar(implementation(group: 'eu.pb4', name: 'common-protection-api')) {
        version {
            strictly "[${project.common_protection_api_version},${project.common_protection_api_version}]"
            prefer project.common_protection_api_version
        }
    }

    // Optional web-map integrations. Their APIs are loader-neutral.
    compileOnly "us.dynmap:DynmapCoreAPI:${project.dynmap_version}"
    compileOnly "de.bluecolored:bluemap-api:${project.bluemap_version}"
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version_range: project.minecraft_version_range,
            neo_version_range      : project.neo_version_range,
            mod_id                 : project.mod_id,
            mod_name               : project.mod_name,
            mod_license            : project.mod_license,
            mod_version            : project.version,
            mod_description        : project.mod_description,
            mod_authors            : project.mod_authors
    ]

    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

def nativeBlockTextures = [
        makeshift_claim_anchor  : 'makeshift_claim_anchor',
        reinforced_claim_anchor : 'reinforced_claim_anchor',
        glistening_claim_anchor : 'glistering_claim_anchor',
        crystal_claim_anchor    : 'crystal_claim_anchor',
        emeradic_claim_anchor   : 'emeradic_claim_anchor',
        withered_claim_anchor   : 'withered_claim_anchor',
        admin_claim_anchor      : 'admin_claim_anchor',
        ender_binding           : 'ender_binding',
        lake_spirit_grace       : 'lake_grace_spirit',
        angelic_aura            : 'angelic_aura',
        heaven_wings            : 'heaven_wings',
        village_core            : 'village_core',
        withering_seal          : 'withering_seal',
        chaos_zone              : 'chaos_zone',
        pvp_arena               : 'pvp_arena',
        explosion_controller    : 'explosion_controller',
        force_field             : 'force_field'
]

def nativeItemModels = [
        reinforced_upgrade_kit: 'minecraft:item/iron_ingot',
        glistening_upgrade_kit: 'minecraft:item/gold_ingot',
        crystal_upgrade_kit   : 'minecraft:item/diamond',
        emeradic_upgrade_kit  : 'minecraft:item/emerald',
        withered_upgrade_kit  : 'minecraft:item/nether_star',
        goggles               : 'minecraft:item/iron_helmet'
]

def nativeClientResources = tasks.register('generateNativeClientResources') {
    def outputDirectory = layout.buildDirectory.dir('generated/resources/nativeClient')
    outputs.dir outputDirectory
    inputs.files nativeBlockTextures.values().collect { file("assets/${it}.png") }
    inputs.property 'nativeBlockTextures', nativeBlockTextures
    inputs.property 'nativeItemModels', nativeItemModels

    doLast {
        def outputRoot = outputDirectory.get().asFile

        nativeBlockTextures.each { blockName, sourceName ->
            def blockState = [
                    variants: [
                            '': [model: "${project.mod_id}:block/${blockName}"]
                    ]
            ]
            def blockModel = [
                    parent  : 'minecraft:block/cube_all',
                    textures: [all: "${project.mod_id}:block/${blockName}"]
            ]
            def itemDefinition = [
                    model: [
                            type : 'minecraft:model',
                            model: "${project.mod_id}:block/${blockName}"
                    ]
            ]

            def blockStateFile = new File(outputRoot, "assets/${project.mod_id}/blockstates/${blockName}.json")
            def blockModelFile = new File(outputRoot, "assets/${project.mod_id}/models/block/${blockName}.json")
            def itemFile = new File(outputRoot, "assets/${project.mod_id}/items/${blockName}.json")
            [blockStateFile, blockModelFile, itemFile].each { it.parentFile.mkdirs() }
            blockStateFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(blockState))
            blockModelFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(blockModel))
            itemFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(itemDefinition))

            copy {
                from file("assets/${sourceName}.png")
                into new File(outputRoot, "assets/${project.mod_id}/textures/block")
                rename { "${blockName}.png" }
            }
        }

        // Greeter has no standalone icon in the original repository.
        def greeterBlockState = new File(outputRoot, "assets/${project.mod_id}/blockstates/greeter.json")
        def greeterBlockModel = new File(outputRoot, "assets/${project.mod_id}/models/block/greeter.json")
        def greeterItem = new File(outputRoot, "assets/${project.mod_id}/items/greeter.json")
        [greeterBlockState, greeterBlockModel, greeterItem].each { it.parentFile.mkdirs() }
        greeterBlockState.text = JsonOutput.prettyPrint(JsonOutput.toJson(
                [variants: ['': [model: "${project.mod_id}:block/greeter"]]]
        ))
        greeterBlockModel.text = JsonOutput.prettyPrint(JsonOutput.toJson(
                [parent: 'minecraft:block/cube_all', textures: [all: 'minecraft:block/emerald_block']]
        ))
        greeterItem.text = JsonOutput.prettyPrint(JsonOutput.toJson(
                [model: [type: 'minecraft:model', model: "${project.mod_id}:block/greeter"]]
        ))

        nativeItemModels.each { itemName, vanillaModel ->
            def itemFile = new File(outputRoot, "assets/${project.mod_id}/items/${itemName}.json")
            itemFile.parentFile.mkdirs()
            itemFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(
                    [model: [type: 'minecraft:model', model: vanillaModel]]
            ))
        }
    }
}

sourceSets.main.resources.srcDir nativeClientResources
neoForge.ideSyncTask nativeClientResources

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('jar', Jar).configure {
    from 'LICENSE'

    from('src/main/resources/data/goml/lang') {
        into 'assets/goml/lang'
    }

    manifest {
        attributes(
                'Specification-Title': project.mod_id,
                'Specification-Vendor': project.mod_authors,
                'Specification-Version': project.mod_version,
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor': project.mod_authors
        )
    }
}

tasks.named('assemble').configure {
    dependsOn tasks.named('jarJar')
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}

// Publishing is opt-in and is never part of a normal local build.
if (System.getenv('CURSEFORGE')) {
    curseforge {
        apiKey = System.getenv('CURSEFORGE')
        project {
            id = '572651'
            releaseType = 'release'
            changelog = System.getenv('CHANGELOG') ?: ''
            changelogType = 'markdown'
            addGameVersion project.minecraft_version
            addGameVersion 'NeoForge'
            mainArtifact tasks.named('jar')
        }
        options {
            forgeGradleIntegration = false
        }
    }
}

if (System.getenv('MODRINTH')) {
    modrinth {
        token = System.getenv('MODRINTH')
        projectId = 'j5niDupl'
        versionNumber = project.version.toString()
        versionName = "Get Off My Lawn ReServed ${project.version}"
        changelog = System.getenv('CHANGELOG') ?: ''
        uploadFile = tasks.named('jar')
        gameVersions = [project.minecraft_version]
        loaders = ['neoforge']
    }
}
